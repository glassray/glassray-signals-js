<style>

  body{width:1200px;height:380px;background:#0f1011;overflow:hidden;

       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}
  /* the signal arriving: a soft wash behind the mark */
  .glow{position:absolute;width:760px;height:460px;top:-150px;
        background:radial-gradient(ellipse at center,rgba(130,143,255,.22),rgba(130,143,255,0) 68%)}
  .grid{position:absolute;inset:0;opacity:.35;
        background-image:linear-gradient(#1a1c20 1px,transparent 1px),linear-gradient(90deg,#1a1c20 1px,transparent 1px);
        background-size:28px 28px;
        -webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 20%,transparent 72%)}
  .row{display:flex;align-items:center;gap:22px;position:relative;z-index:1}
  .mark{width:86px;height:86px;flex:none;filter:drop-shadow(0 0 18px rgba(130,143,255,.45))}
  .mark rect{fill:#f4f5f7}
  h1{font-size:60px;font-weight:600;letter-spacing:-.035em;line-height:1}
  h1 .at{color:#828fff}
  p{position:relative;z-index:1;margin-top:20px;font-size:20px;line-height:1.5;color:#a9adb6;
    letter-spacing:-.012em;max-width:860px;text-align:center}
  .kbd{position:relative;z-index:1;margin-top:26px;display:flex;gap:10px}
  .kbd span{font-family:"JetBrains Mono",monospace;font-size:14px;color:#8a8f98;
            border:1px solid #26282d;background:#151618;border-radius:7px;padding:7px 12px}
  .kbd b{color:#4cb782;font-weight:500}
